# cbindgen.toml
# 输出语言：c 或 c++
language = "C++"

# # 头文件输出路径和名称
# output = "my_static_lib.h"

# # 生成的头文件顶部添加的注释
header = "/* Generated by cbindgen. Do not edit manually. */"

# # 宏保护（避免头文件重复包含）
include_guard = "MY_STATIC_LIB_H"

# 类型映射：Rust 类型 -> C 类型
[export]
include = [
    "rust_add",          # 要导出的函数名
    "RustPoint",         # 要导出的结构体名
    "rust_point_distance"
]

# 结构体配置：保证和 Rust #[repr(C)] 一致
# [structs]
# derive_eq = false
# derive_hash = false
# derive_debug = false

# 函数配置
# [functions]
# prefix = ""
# postfix = ""