version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginx-ssl
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 挂载配置文件
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      # 挂载证书目录
      - ./cert:/etc/nginx/cert:ro
      # 挂载网站文件
      - ./html:/usr/share/nginx/html:ro
    restart: unless-stopped