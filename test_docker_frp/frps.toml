# frps.toml - 服务端配置
bindAddr = "0.0.0.0"
bindPort = 7000

# HTTP 虚拟主机端口（对外公开Web服务的统一入口）
vhostHTTPPort = 8080

# Dashboard 配置（可选，便于监控）
webServer.addr = "0.0.0.0"
webServer.port = 7500
webServer.user = "admin"
webServer.password = "your-dashboard-password"

# 日志配置
log.to = "console"
log.level = "info"

# ========== 为每个 frpc 客户端预先定义 user 和 token ==========
# 客户端 B：对外公开 Web 服务
[[users]]
name = "public-web"
auth.token = "Frp@2024_PublicWeb#Secure"

# 客户端 C：STCP 服务提供方（内部数据库）
[[users]]
name = "stcp-provider"
auth.token = "Frp@2024_StcpProvider$Secret"

# 客户端 D：访问方（带 Fallback）
[[users]]
name = "visitor"
auth.token = "Frp@2024_Visitor_Fallback_Key"